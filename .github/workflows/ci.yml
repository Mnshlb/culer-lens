name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # the data job runs only when started by hand (football-data.co.uk's terms)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python · lint, types, tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: barca
          POSTGRES_PASSWORD: barca
          POSTGRES_DB: barca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barca -d barca_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Lint
        run: |
          uv run ruff check src apps/api tests scripts
          uv run ruff format --check src apps/api tests scripts
      - name: Type-check
        run: uv run mypy
      - name: Unit and integration tests (SQLite)
        run: uv run pytest -m "not data"
      - name: Integration tests (Postgres)
        run: uv run pytest tests/integration
        env:
          TEST_DATABASE_URL: postgresql://barca:barca@localhost:5432/barca_test
      - name: Browser-test fixtures match the API
        run: |
          uv run python scripts/export_e2e_fixtures.py
          git diff --exit-code apps/web/e2e/fixtures

  data:
    name: Data · sample pipeline and quality gate
    # Manual only: football-data.co.uk's files are for private individuals, not automated
    # downloads, so this job never runs on pushes or on a schedule.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Download a sample (40 latest Barcelona matches + all football-data seasons)
        run: uv run barca fetch --sample 40
      - name: Build and validate (fails on any error-level rule)
        run: uv run barca build
      - name: Feature store
        run: uv run barca features
      - name: Data-quality and leakage tests
        run: uv run pytest tests/data_quality
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-quality-report
          path: reports/data_quality.md
          if-no-files-found: ignore

  web:
    name: Web · lint, types, browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop + mobile, mocked API)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker · images build
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
